version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<servicio>_1
      APP_HOST: psats-llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Imagen construida desde el zip reproducible de la Release: ver umbrel/README.md en el repo de llave-inglesa.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.4.0@sha256:d8593dad7a8d4b76c4bf08577ef105c6477d659c641ee09f30d5b323cce33f53
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp

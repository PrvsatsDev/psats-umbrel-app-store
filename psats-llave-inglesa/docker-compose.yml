version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<servicio>_1
      APP_HOST: psats-llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Imagen construida desde el zip reproducible de la Release: ver umbrel/README.md en el repo de llave-inglesa.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.3.2@sha256:40ca47d473e9f9ba864a82e2359e78c15ba47f91aec86df887cfe03bdd6a6306
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp

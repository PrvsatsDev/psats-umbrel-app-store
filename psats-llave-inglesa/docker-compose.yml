version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<servicio>_1
      APP_HOST: psats-llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Imagen construida desde el zip reproducible de la Release: ver umbrel/README.md en el repo de llave-inglesa.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.7.0@sha256:4b0a94b5d6b7b3db926e97cb041e38c5ec8a4c9c46de33a7188b494b62e33026
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp

version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<servicio>_1
      APP_HOST: psats-llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Imagen construida desde el zip reproducible de la Release: ver umbrel/README.md en el repo de llave-inglesa.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.6.1@sha256:394d3db150ddd3641b55cc0da220f6a2467eecc43e5a7c5c02410344e0ca5052
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp

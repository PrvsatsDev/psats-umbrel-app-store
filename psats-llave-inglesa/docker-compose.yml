version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<servicio>_1
      APP_HOST: psats-llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Imagen construida desde el zip reproducible de la Release: ver umbrel/README.md en el repo de llave-inglesa.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.4.1@sha256:99993ca1b1439e495d093a967f07a56743a8781c1a7ab34451f30bd135d75e54
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp

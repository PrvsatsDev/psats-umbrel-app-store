version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<servicio>_1
      APP_HOST: psats-llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Imagen construida desde el zip reproducible de la Release: ver umbrel/README.md en el repo de llave-inglesa.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.6.0@sha256:72ebf90f5392f0e6186d78d1afe68b49e714c9fbaf2b6b7a71650bc720ef1d11
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp

releaseNotes: >-
  Privacy in the browser: the page is never sent to the browser's translator, and text fields skip spell checkers
  and autocorrect, so your setup does not leave the device that way. The guide explains it under «Your browser».
  Opening a file with absurdly deep nesting no longer hangs the app, and a damaged file now says so.


  Privacidad en el navegador: la página nunca se manda al traductor del navegador, y los campos de texto no pasan
  por correctores ni autocorrección, así que tu esquema no sale del equipo por ahí. La guía lo explica en «Tu
  navegador». Abrir un fichero anidado sin fin ya no bloquea la app, y un fichero dañado ahora avisa.

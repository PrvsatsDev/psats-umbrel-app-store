manifestVersion: 2.0
id: psats-llave-inglesa
name: llave-inglesa
tagline: Put your bitcoin custody to the test before someone else does
icon: https://llave-inglesa.vualt.net/logo.svg
category: bitcoin
version: "0.5.0"
port: 4580
description: >-
  Offline simulator of Bitcoin custody setups (single-sig, passphrase, multisig). You describe which keys, devices
  and backups you have, where they are and who knows what, and it works out the cheapest ways to rob you, which loss
  events would leave you without your funds, how many places you have to visit to sign and whether your heirs would
  reach the funds, always explaining why. It also builds your wallet descriptor (with the first address to check it),
  a PDF with its QR code and a letter for your heirs.


  Never type in real seed phrases, private keys or passphrases: they are not needed. The app cannot make any network
  request, and your setup is stored encrypted in the browser.


  Requires umbrelOS 2.0 or later: it opens over HTTPS, because the browser's encryption only works in a secure
  context. The browser will warn about Umbrel's certificate unless you install and trust it on each device: Umbrel
  explains how, and its risks, under **Settings → Advanced settings → Network**. The connection is encrypted either
  way. Opened over plain HTTP, everything works except saving or opening encrypted setups.


  Interface in English and Spanish (detected from the browser, switchable with ES | EN).


  —


  Simulador offline de esquemas de custodia Bitcoin (single-sig, passphrase, multisig). Describes qué keys,
  dispositivos y backups tienes, dónde están y quién sabe qué, y calcula las formas más baratas de robarte, qué
  desgracias te dejarían sin fondos, a cuántos sitios tienes que ir para firmar y si tus herederos llegarían a los
  fondos, explicando siempre por qué. También genera el descriptor de tu cartera (con la primera dirección para
  comprobarlo), un PDF con su QR y una carta para tus herederos.


  Nunca escribas frases semilla, claves privadas ni passphrases reales: no hacen falta. La app no puede hacer ninguna
  petición de red, y tu esquema se guarda cifrado en el navegador.


  Requiere umbrelOS 2.0 o posterior: se abre por HTTPS, porque el cifrado del navegador solo funciona en un contexto
  seguro. El navegador avisará del certificado de Umbrel salvo que lo instales como de confianza en cada equipo:
  Umbrel explica cómo, y sus riesgos, en **Configuración avanzada → Red → Cómo usar HTTPS → Configuración avanzada del
  certificado**. La conexión va cifrada de todos modos. Abierta por HTTP, funciona todo salvo guardar o abrir esquemas
  cifrados.

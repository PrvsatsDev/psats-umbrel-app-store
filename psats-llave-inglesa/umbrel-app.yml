releaseNotes: >-
  Timelocks: a key or a whole path can require the coins to stay unmoved for a while. Templates for simple
  inheritance, decaying and expanding multisig (Liana's names), a free tree editor for anything else, with a plain
  summary of the ways to spend, and how often you move the coins. The engine counts the delay instead of the loss,
  the wait for heirs and the cost of renewing. The descriptor is wsh(miniscript), checked against Bitcoin Core's
  vectors and limits, and imports Liana descriptors (keys reused with <2;3>). The catalog says which devices sign
  Miniscript.


  Timelocks: una key o una vía entera puede exigir que las monedas lleven un tiempo sin moverse. Plantillas de
  herencia simple, multisig decreciente y ampliable (los nombres de Liana), un editor libre del árbol para lo demás,
  con un resumen en llano de las formas de gastar, y cada cuánto mueves las monedas. El motor cuenta el retraso en
  vez de la pérdida, la espera de los herederos y lo que cuesta renovar. El descriptor es wsh(miniscript),
  comprobado con los vectores y límites de Bitcoin Core, e importa los descriptores de Liana (keys repetidas con
  <2;3>). El catálogo dice qué dispositivos firman Miniscript.

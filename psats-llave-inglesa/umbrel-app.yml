releaseNotes: >-
  New attacks: malware on the signing computer or phone (which also reveals the descriptor), a tampered device
  (second-hand, broken seal or unofficial shop) and own entropy below 128 bits. Where each person lives: the wrench
  attack is now paid per assault. A multisig with no descriptor backup anywhere is a serious issue. A safe inside
  another location now counts. On the map, Delete removes the selection and items can be dragged between locations.


  Nuevos ataques: malware en el ordenador o móvil de firma (que además da el descriptor), un dispositivo manipulado
  (de segunda mano, con el precinto roto o de tienda no oficial) y entropía propia por debajo de 128 bits. Dónde vive
  cada persona: la llave inglesa se paga por asalto. Un multisig sin ningún backup del descriptor es un problema
  grave. Una caja fuerte dentro de otra ubicación ya cuenta. En el mapa, Supr elimina lo seleccionado y los objetos se
  arrastran entre ubicaciones.
